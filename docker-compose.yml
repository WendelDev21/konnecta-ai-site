services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-project:latest
    container_name: my-project
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Descomente para carregar variaveis de ambiente de um arquivo
    # env_file:
    #   - .env.production.local
